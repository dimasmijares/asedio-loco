name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Especificaciones KDD (grafo, huérfanos y ciclo de vida)
        run: npm run kdd:check
      - name: Cada prueba E2E está en algún grupo de e2e-prod
        run: npm run e2e:grupos
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Desplegar en Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Las pruebas E2E van repartidas en trabajos paralelos (cada uno en su propio runner),
  # así la batería tarda lo que la prueba más lenta y no la suma de todas.
  e2e-prod:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - grupo: basicas
            args: lobby smoke perf controls calidad pwa
          - grupo: hud
            args: touch hud-compact tutorial encuadre
          - grupo: espectador-repeticion
            args: espectador repeticion-lava
          - grupo: menus-y-marca
            args: portada marca
          - grupo: fisica
            args: physics
          - grupo: solitario
            args: solo
          - grupo: cuatro-jugadores
            args: multiplayer -g "4 jugadores"
          - grupo: migracion
            args: multiplayer -g "anfitrión"
          - grupo: revancha
            args: multiplayer -g "revancha"
          - grupo: red-mala
            args: multiplayer -g "red mala"
          - grupo: desconexion
            args: multiplayer -g "desconectado"
    name: e2e (${{ matrix.grupo }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium de Playwright en caché, por versión: con la caché solo faltan las dependencias del
      # sistema (~30 s menos por trabajo).
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pruebas E2E contra producción
        run: npm run e2e:prod -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-e2e-${{ matrix.grupo }}
          path: test-results/
          retention-days: 7
